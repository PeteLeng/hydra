[project]
name = "nlu-notebooks"
version = "0.1.0"
description = "Text-first NLU learning notebooks"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch==2.7.1",
    "transformers==4.57.6",
    "seqeval==1.2.2",
    "pytorch-crf==0.7.2",
    "matplotlib>=3.10,<4",
]

[dependency-groups]
dev = ["marimo>=0.19,<1"]

[tool.uv]
package = false
cache-dir = ".uv-cache"
python-downloads = "never"

[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'win32'" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
